services:
  kokoro:
    image: dustynv/kokoro-tts:fastapi-r36.4.0-cu128-24.04
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    ports:
      - "8880:8880"
    network_mode: host

  whisper:
    build:
      context: ./whisper
      network: host
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - whisper-data:/data
    network_mode: host
    command: ["vox-box", "start", "--huggingface-repo-id", "Systran/faster-whisper-small", "--data-dir", "/data", "--port", "11435", "--device", "cuda"]

  ollama:
    build:
      context: ./ollama
      network: host
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1
    volumes:
      - ollama:/root/.ollama
    network_mode: host

  agent:
    build:
      context: ./agent
      network: host
    environment:
      - WHISPER_URL=http://localhost:11435/v1
      - OLLAMA_URL=http://localhost:11434/v1
      - KOKORO_URL=http://localhost:8880/v1
    depends_on:
      - kokoro
      - whisper
      - ollama
    network_mode: host
    ports:
      - "7860:7860"

  frontend:
    build:
      context: ./frontend
      network: host
    environment:
      - AGENT_URL=http://localhost:7860/api/offer
      - HOSTNAME=0.0.0.0
    depends_on:
      - agent
    network_mode: host
    ports:
      - "3000:3000"

volumes:
  ollama:
  whisper-data:
